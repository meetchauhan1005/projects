<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#circleGradient)" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Inner dark circle -->
  <circle cx="100" cy="100" r="80" fill="#1a1a2e" stroke="url(#circleGradient)" stroke-width="2"/>
  
  <!-- Circuit patterns -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8">
    <!-- Left circuit -->
    <path d="M30 80 L50 80 L50 100 L70 100"/>
    <path d="M30 120 L50 120 L50 100"/>
    <circle cx="30" cy="80" r="3" fill="#00d4ff"/>
    <circle cx="30" cy="120" r="3" fill="#00d4ff"/>
    <circle cx="70" cy="100" r="3" fill="#00d4ff"/>
    
    <!-- Right circuit -->
    <path d="M170 80 L150 80 L150 100 L130 100"/>
    <path d="M170 120 L150 120 L150 100"/>
    <circle cx="170" cy="80" r="3" fill="#00d4ff"/>
    <circle cx="170" cy="120" r="3" fill="#00d4ff"/>
    <circle cx="130" cy="100" r="3" fill="#00d4ff"/>
    
    <!-- Bottom circuit -->
    <path d="M80 170 L80 150 L100 150 L120 150 L120 170"/>
    <circle cx="80" cy="170" r="3" fill="#00d4ff"/>
    <circle cx="120" cy="170" r="3" fill="#00d4ff"/>
    <circle cx="100" cy="150" r="3" fill="#00d4ff"/>
  </g>
  
  <!-- Lightning bolt -->
  <path d="M85 60 L95 60 L88 85 L105 85 L95 125 L85 125 L92 100 L75 100 Z" 
        fill="url(#boltGradient)" stroke="#00d4ff" stroke-width="1"/>
  
  <!-- Company name -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">MAHADEV</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="normal" 
        fill="#00d4ff" text-anchor="middle">ELECTRONICS</text>
</svg>